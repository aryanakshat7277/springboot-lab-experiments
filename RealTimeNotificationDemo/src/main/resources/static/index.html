<!DOCTYPE html>
<html>
<head>
    <title>Real-Time Notifications</title>
    <style>
        body { font-family: sans-serif; padding: 30px; max-width: 650px; margin: 0 auto; }
        .form-box { background: #f0f4f8; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        input { width: 95%; padding: 8px; margin: 5px 0 10px 0; }
        button { padding: 8px 15px; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; }
        .list-box { background: #1e293b; color: white; padding: 15px; border-radius: 5px; min-height: 200px; font-family: monospace; }
        .item { padding: 8px 0; border-bottom: 1px solid #334155; }
        .tag { background: #0284c7; padding: 2px 6px; border-radius: 3px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <h2>🔔 Real-Time Notifications</h2>

    <!-- Simple Form to Send Custom Notification -->
    <div class="form-box">
        <h4>Send New Notification:</h4>
        <input type="text" id="title" placeholder="Title (e.g. System Alert)" />
        <input type="text" id="message" placeholder="Message (e.g. Server maintenance in 10 mins)" />
        <button onclick="sendNotification()">Send Notification</button>
    </div>

    <!-- Live Real-Time Notification Stream -->
    <h3>Live Notifications Stream:</h3>
    <div class="list-box" id="notificationList">
        Connecting to real-time stream...
    </div>

<script>
    // Subscribe to SSE Real-Time Stream
    const eventSource = new EventSource('/api/notifications/subscribe');
    const list = document.getElementById('notificationList');

    eventSource.addEventListener('notification', function(event) {
        const data = JSON.parse(event.data);
        if (list.innerText.includes('Connecting')) list.innerHTML = '';

        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `<span class="tag">${data.type}</span> <strong>${data.title}</strong>: ${data.message} <small style="color: #94a3b8">(${new Date().toLocaleTimeString()})</small>`;
        list.prepend(item);
    });

    async function sendNotification() {
        const title = document.getElementById('title').value || "Alert";
        const message = document.getElementById('message').value || "Hello Real-Time World!";

        await fetch('/api/notifications/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title, message: message, type: "INFO" })
        });

        document.getElementById('title').value = '';
        document.getElementById('message').value = '';
    }
</script>

</body>
</html>
