<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Database Dashboard - MultiDatabases</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --db1-color: #4f46e5;
            --db2-color: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .header {
            padding: 20px 24px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-size: 0.75rem;
            background: #dbeafe;
            color: #1e40af;
            padding: 2px 10px;
            border-radius: 999px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 10px;
            padding: 16px 24px;
            background: #f1f5f9;
            border-bottom: 1px solid var(--border-color);
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-db1 {
            color: var(--db1-color);
            border-color: #c7d2fe;
        }

        .btn-db1.active, .btn-db1:hover {
            background: var(--db1-color);
            color: #ffffff;
        }

        .btn-db2 {
            color: var(--db2-color);
            border-color: #a7f3d0;
        }

        .btn-db2.active, .btn-db2:hover {
            background: var(--db2-color);
            color: #ffffff;
        }

        .btn-all {
            color: var(--primary);
            border-color: #bfdbfe;
        }

        .btn-all.active, .btn-all:hover {
            background: var(--primary);
            color: #ffffff;
        }

        .h2-link {
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .h2-link:hover {
            text-decoration: underline;
        }

        .content {
            padding: 24px;
        }

        .url-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #334155;
            margin-bottom: 16px;
        }

        .json-viewer {
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            overflow-x: auto;
            min-height: 300px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">
            ⚡ Spring Data JPA Multi-Database Manager
            <span class="badge">Dual DataSources</span>
        </div>
        <a href="/h2-console" target="_blank" class="h2-link">⚡ Open H2 Console (/h2-console)</a>
    </div>

    <div class="controls">
        <button class="btn btn-all active" onclick="loadData('/api/all', this)">🌐 Combined Both DBs (/api/all)</button>
        <button class="btn btn-db1" onclick="loadData('/api/db1/books', this)">📚 Database 1: Books (/api/db1/books)</button>
        <button class="btn btn-db2" onclick="loadData('/api/db2/students', this)">🎓 Database 2: Students (/api/db2/students)</button>
    </div>

    <div class="content">
        <div class="url-box" id="urlDisplay">GET http://localhost:8080/api/all</div>
        <pre class="json-viewer" id="jsonDisplay">Loading data...</pre>
    </div>
</div>

<script>
    async function loadData(endpoint, btn) {
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');

        document.getElementById('urlDisplay').innerText = `GET http://localhost:8080${endpoint}`;
        const jsonDisplay = document.getElementById('jsonDisplay');
        jsonDisplay.innerText = 'Fetching live database response...';

        try {
            const response = await fetch(endpoint);
            const data = await response.json();
            jsonDisplay.innerText = JSON.stringify(data, null, 2);
        } catch (error) {
            jsonDisplay.innerText = `Error connecting to endpoint: ${error.message}`;
        }
    }

    loadData('/api/all', document.querySelector('.btn-all'));
</script>

</body>
</html>
