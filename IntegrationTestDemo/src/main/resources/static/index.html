<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - IntegrationTestDemo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #0f172a;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .main-card {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 32px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 12px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-bottom: 24px;
            align-items: center;
        }

        input {
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        .btn-add {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .badge-count {
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 0.85rem;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<div class="main-card">
    <h1>📦 Product Management Dashboard</h1>
    <p class="subtitle">Spring Boot Integration Testing Demo Application</p>

    <!-- Add Product Form -->
    <div class="form-grid">
        <input type="text" id="name" placeholder="Product Name (e.g. Headphone)" required />
        <input type="number" id="quantity" placeholder="Qty" min="1" required />
        <input type="number" step="0.01" id="price" placeholder="Price ($)" required />
        <button class="btn-add" onclick="addProduct()">+ Add Product</button>
    </div>

    <!-- Product List Table -->
    <h2>All Products <span class="badge-count" id="productCount">0</span></h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Quantity</th>
                <th>Price ($)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="productTableBody">
            <tr>
                <td colspan="5" style="text-align: center; color: #94a3b8;">Loading products...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const API_URL = '/products';

    // Fetch and display all products
    async function loadProducts() {
        try {
            const response = await fetch(API_URL);
            const products = await response.json();
            
            document.getElementById('productCount').innerText = products.length;
            const tbody = document.getElementById('productTableBody');
            
            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8;">No products found in database.</td></tr>`;
                return;
            }

            tbody.innerHTML = products.map(p => `
                <tr>
                    <td><strong>#${p.id}</strong></td>
                    <td>${p.name}</td>
                    <td>${p.quantity}</td>
                    <td>$${p.price.toFixed(2)}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteProduct(${p.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        } catch (error) {
            console.error('Error fetching products:', error);
        }
    }

    // Add a new product
    async function addProduct() {
        const name = document.getElementById('name').value.trim();
        const quantity = parseInt(document.getElementById('quantity').value);
        const price = parseFloat(document.getElementById('price').value);

        if (!name || isNaN(quantity) || isNaN(price)) {
            alert('Please fill in all product fields correctly.');
            return;
        }

        try {
            await fetch(`${API_URL}/addProduct`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, quantity, price })
            });

            document.getElementById('name').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('price').value = '';
            
            loadProducts();
        } catch (error) {
            alert('Failed to add product: ' + error.message);
        }
    }

    // Delete a product
    async function deleteProduct(id) {
        if (!confirm(`Are you sure you want to delete Product #${id}?`)) return;

        try {
            await fetch(`${API_URL}/delete/${id}`, { method: 'DELETE' });
            loadProducts();
        } catch (error) {
            alert('Failed to delete product: ' + error.message);
        }
    }

    // Load products on initial page load
    loadProducts();
</script>

</body>
</html>
