<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST API Client - StudentCRUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --method-post: #2563eb;
            --method-get: #16a34a;
            --method-put: #d97706;
            --method-delete: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 1150px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            padding: 16px 24px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-title span {
            font-size: 0.8rem;
            background: #e0e7ff;
            color: #3730a3;
            padding: 2px 8px;
            border-radius: 999px;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 560px;
        }

        @media (max-width: 850px) {
            .workspace-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel-left {
            border-right: 1px solid var(--border-color);
            background: #ffffff;
        }

        .panel-right {
            background: #fafafa;
        }

        .url-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .method-select {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            background: #f1f5f9;
            color: var(--method-post);
            cursor: pointer;
            outline: none;
        }

        .url-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: var(--text-main);
            outline: none;
            transition: border 0.2s;
        }

        .url-input:focus {
            border-color: var(--primary);
        }

        .headers-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn-add-header {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
            min-height: 280px;
        }

        .editor-header {
            padding: 8px 12px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .code-textarea {
            width: 100%;
            height: 100%;
            min-height: 250px;
            border: none;
            padding: 14px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #1e293b;
            resize: none;
            outline: none;
            background: transparent;
        }

        .send-btn {
            padding: 12px 20px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .response-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .response-title {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            background: var(--success-bg);
            color: var(--success);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .time-badge {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .response-tabs {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .tab {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            background: transparent;
            border: none;
        }

        .tab.active {
            background: #e0e7ff;
            color: #3730a3;
        }

        .response-body-wrapper {
            position: relative;
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #0f172a;
            color: #f8fafc;
            padding: 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            line-height: 1.6;
            overflow-x: auto;
            min-height: 320px;
        }

        .copy-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .h2-link {
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .h2-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <div class="app-title">
            REST API Client <span>StudentCRUD</span>
        </div>
        <a href="/h2-console" target="_blank" class="h2-link">⚡ Open H2 Console (/h2-console)</a>
    </div>

    <div class="workspace-grid">
        <!-- Left Panel: Request Builder -->
        <div class="panel panel-left">
            <div class="url-bar">
                <select id="httpMethod" class="method-select" onchange="updateMethodColor()">
                    <option value="POST" selected>POST</option>
                    <option value="GET">GET</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                </select>
                <input type="text" id="requestUrl" class="url-input" value="http://localhost:8080/api/students">
            </div>

            <div class="headers-section">
                <span>Headers (1) ˅</span>
                <button class="btn-add-header">+ Add Header</button>
            </div>

            <div class="editor-container">
                <div class="editor-header">JSON Body</div>
                <textarea id="requestBody" class="code-textarea">{
  "name": "John Doe",
  "email": "john@example.com",
  "age": 25
}</textarea>
            </div>

            <button class="send-btn" onclick="sendApiRequest()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                Send Request
            </button>
        </div>

        <!-- Right Panel: Response Viewer -->
        <div class="panel panel-right">
            <div class="response-header">
                <div class="response-title">
                    Response
                    <span id="statusBadge" class="status-badge">200 OK</span>
                </div>
                <span id="timeBadge" class="time-badge">110ms</span>
            </div>

            <div class="response-tabs">
                <button class="tab active">JSON</button>
                <button class="tab">Body</button>
                <button class="tab">Headers</button>
            </div>

            <div class="response-body-wrapper">
                <pre id="responseBody">{
  "name": "John Doe",
  "email": "john@example.com",
  "age": 25,
  "id": 2
}</pre>
                <button class="copy-btn" onclick="copyResponse()">
                    📋 Copy
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function updateMethodColor() {
        const select = document.getElementById('httpMethod');
        const colors = {
            'POST': '#2563eb',
            'GET': '#16a34a',
            'PUT': '#d97706',
            'DELETE': '#dc2626'
        };
        select.style.color = colors[select.value] || '#2563eb';
    }

    async function sendApiRequest() {
        const method = document.getElementById('httpMethod').value;
        const url = document.getElementById('requestUrl').value;
        const bodyText = document.getElementById('requestBody').value;
        const responseBody = document.getElementById('responseBody');
        const statusBadge = document.getElementById('statusBadge');
        const timeBadge = document.getElementById('timeBadge');

        const startTime = performance.now();

        try {
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };

            if (method === 'POST' || method === 'PUT') {
                options.body = bodyText;
            }

            const response = await fetch(url, options);
            const endTime = performance.now();
            const duration = Math.round(endTime - startTime);

            statusBadge.innerText = `${response.status} ${response.statusText || 'OK'}`;
            timeBadge.innerText = `${duration}ms`;

            if (response.status >= 200 && response.status < 300) {
                statusBadge.style.background = '#dcfce7';
                statusBadge.style.color = '#16a34a';
            } else {
                statusBadge.style.background = '#fee2e2';
                statusBadge.style.color = '#dc2626';
            }

            const textData = await response.text();
            try {
                const jsonData = JSON.parse(textData);
                responseBody.innerText = JSON.stringify(jsonData, null, 2);
            } catch (e) {
                responseBody.innerText = textData;
            }

        } catch (error) {
            statusBadge.innerText = 'ERROR';
            statusBadge.style.background = '#fee2e2';
            statusBadge.style.color = '#dc2626';
            responseBody.innerText = `Network Error: ${error.message}`;
        }
    }

    function copyResponse() {
        const text = document.getElementById('responseBody').innerText;
        navigator.clipboard.writeText(text);
        alert('Response copied to clipboard!');
    }

    updateMethodColor();
</script>

</body>
</html>
