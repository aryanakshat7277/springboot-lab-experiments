<!DOCTYPE html>
<html>
<head>
    <title>HTTP Exceptions</title>
    <style>
        body { font-family: sans-serif; padding: 30px; }
        .btn-list { margin-bottom: 20px; }
        button { margin: 4px; padding: 8px 12px; cursor: pointer; }
        pre { background: #f0f4f8; padding: 15px; border-radius: 5px; font-family: monospace; }
    </style>
</head>
<body>

    <h2>HTTP Exception Handling</h2>

    <div class="btn-list">
        <button onclick="testApi('200')">200 OK</button>
        <button onclick="testApi('400')">400 Bad Request</button>
        <button onclick="testApi('401')">401 Unauthorized</button>
        <button onclick="testApi('403')">403 Forbidden</button>
        <button onclick="testApi('404')">404 Not Found</button>
        <button onclick="testApi('409')">409 Conflict</button>
        <button onclick="testApi('500')">500 Server Error</button>
    </div>

    <h3 id="statusText">HTTP Status: Ready</h3>
    <pre id="result">Click any button above to see response</pre>

<script>
    async function testApi(code) {
        document.getElementById('statusText').innerText = `HTTP Status: GET /api/test/${code}...`;
        try {
            const res = await fetch(`/api/test/${code}`);
            const data = await res.json();
            document.getElementById('statusText').innerText = `HTTP Status: ${res.status} ${res.statusText}`;
            document.getElementById('result').innerText = JSON.stringify(data, null, 2);
        } catch (e) {
            document.getElementById('result').innerText = 'Error: ' + e.message;
        }
    }
</script>

</body>
</html>
